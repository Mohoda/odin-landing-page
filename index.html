    <title>Landing Page</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,700;0,900;1,300&display=swap">
</head>
<body>
    <div class="header">
        <div class="logo">header logo</div>
        <ul class="links">
            <li><a href="#" header link 1></a></li>
            <li><a href="#" header link 2></a></li>
            <li><a href="#" header link 3></a></li>

    <div class="hero">

            <button>Sign up</button>

    <div class="info">

        <div class="cards">
            <div class="card">
                <div class="card box">

        <p class="quote-text">Spiderman is the best</p>

    </div>
    <div class="cta-section">
        <div class="cta">

                <p>you better sign up.. or else</p>
